services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      COPILOT_QDRANT_URL: http://qdrant:6333
      COPILOT_REDIS_URL: redis://redis:6379/0
      COPILOT_OLLAMA_URL: http://ollama:11434
      COPILOT_INDEX_DIR: /index
    volumes:
      - ./data/corpus:/app/data/corpus:ro
      - index:/index
      - hf-models:/models/hf
    depends_on: [qdrant, redis, ollama]

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: [qdrant:/qdrant/storage]

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]

  ollama:
    image: ollama/ollama:0.5.7
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    # Remove this block to run the LLM on CPU (much slower).
    #deploy:
    #  resources:
    #    reservations:
    #      devices:
    #        - driver: nvidia
    #          count: 1
    #          capabilities: [gpu]

volumes:
  index:
  qdrant:
  ollama:
  hf-models:
