# Start with:  python scripts/manage.py up        (Windows, Linux, macOS)
# GPU:         python scripts/manage.py up --gpu  (or COPILOT_GPU=true in .env)
#
# Only the web UI/API is published on the network, on COPILOT_HOST:COPILOT_PORT from .env.
# Qdrant, Redis and Ollama listen on 127.0.0.1 only, so they are not reachable from other machines.
services:
  api:
    build: .
    ports:
      - "${COPILOT_HOST:-0.0.0.0}:${COPILOT_PORT:-8000}:8000"
    env_file: [.env]
    environment:
      # Inside the container the server always listens on 0.0.0.0:8000; the published
      # address above decides where it is reachable from.
      COPILOT_HOST: 0.0.0.0
      COPILOT_PORT: "8000"
      COPILOT_QDRANT_URL: http://qdrant:6333
      COPILOT_REDIS_URL: redis://redis:6379/0
      COPILOT_OLLAMA_URL: http://ollama:11434
      COPILOT_INDEX_DIR: /index
      COPILOT_USERS_DB: /index/users.db
    volumes:
      - ./data/corpus:/app/data/corpus:ro
      - index:/index
      - hf-models:/models/hf
    depends_on: [qdrant, redis, ollama]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrant:/qdrant/storage]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.5.7
    ports: ["127.0.0.1:11434:11434"]
    volumes: [ollama:/root/.ollama]
    restart: unless-stopped

volumes:
  index:
  qdrant:
  ollama:
  hf-models:
