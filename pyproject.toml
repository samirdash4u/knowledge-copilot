[project]
name = "knowledge-copilot"
version = "0.1.0"
description = "Permission-aware RAG copilot over policy and engineering documentation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "qdrant-client>=1.9",
    "redis>=5.0",
    "pypdf>=4.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
copilot = "copilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
