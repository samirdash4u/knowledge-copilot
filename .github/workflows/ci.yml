name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Lint
        if: runner.os == 'Linux'
        run: ruff check src tests && ruff format --check src tests
      - name: Helper script and compose files
        shell: bash
        run: |
          python scripts/manage.py --help
          python scripts/manage.py setup
          python scripts/manage.py clean --dry-run
          if [ "$RUNNER_OS" = "Linux" ]; then
            docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
          fi
          rm .env
      - name: Tests (offline backends, includes ACL leak and cache-poisoning tests)
        run: pytest -q
      - name: Offline eval (fails on any leak)
        env:
          COPILOT_EMBEDDER: hash
          COPILOT_RERANKER: none
          COPILOT_VECTOR_STORE: memory
          COPILOT_CACHE: memory
          COPILOT_LLM: echo
          COPILOT_INDEX_DIR: ${{ runner.temp }}/index
        shell: bash
        run: |
          copilot ingest
          copilot eval --modes bm25,vector,hybrid --out reports/eval-offline.json
